[project]
name = "ai-financial-platform"
version = "0.1.0"
description = "AI Financial Reporting & Revenue Intelligence Platform — local MVP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "docs", "plans"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line length handled by formatter, not enforced
    "B008",  # FastAPI uses function calls (Depends/Query) in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # tests may bind intentionally-unused fixtures/locals
