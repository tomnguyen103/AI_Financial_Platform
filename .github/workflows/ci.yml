name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint (ruff)
        run: ruff check app scripts tests
      - name: Test (pytest + coverage gate)
        # Coverage flags (--cov=app --cov=scripts --cov-fail-under=80) come from
        # pyproject.toml [tool.pytest.ini_options] addopts; pytest-cov is pulled
        # in via requirements.txt. The job fails if TOTAL coverage drops below 80%.
        run: pytest
